<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Stro-Deck</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:#000;
    background-image:radial-gradient(130% 85% at 50% -10%, #131317 0%, #070709 45%, #000 100%);
    background-size:cover;background-position:center;background-repeat:no-repeat;background-attachment:fixed;
    color:#f2f2f4;
    font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Arabic",sans-serif;
    overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  body.has-bg::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.10) 0%, rgba(0,0,0,.28) 55%, rgba(0,0,0,.52) 100%)}
  header{position:relative;z-index:3;height:58px;display:flex;align-items:center;
    justify-content:flex-start;padding:0 26px}
  .clock{display:flex;align-items:baseline;gap:7px;font-variant-numeric:tabular-nums;
    color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
  header.c-bold .clock{font-size:clamp(30px,5.4vh,48px);font-weight:700;letter-spacing:.03em}
  header.c-thin .clock{font-size:clamp(30px,5.4vh,48px);font-weight:200;letter-spacing:.16em}
  header.c-small .clock{font-size:17px;font-weight:600;letter-spacing:.06em;color:rgba(255,255,255,.9)}
  header.c-hidden .clock{display:none}
  .clock .ap{font-size:.42em;font-weight:600;letter-spacing:.14em;opacity:.72;margin-left:2px}
  .deck{position:absolute;inset:58px 0 0 0;z-index:1;display:grid;padding:0 16px 16px;
    align-content:center;justify-items:center}
  .cell{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-width:0;min-height:0}
  .tile{
    --c:#39ff14;--r:0deg;--x:0px;--y:0px;--s:1;
    position:relative;width:var(--tile,120px);height:var(--tile,120px);
    border:1px solid rgba(255,255,255,.30);
    border-radius:27%;
    background:linear-gradient(155deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.040) 45%, rgba(255,255,255,.015) 100%);
    -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.06);
    backdrop-filter:blur(22px) saturate(190%) brightness(1.06);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.42),inset 0 -1px 0 rgba(0,0,0,.16),
      0 10px 26px rgba(0,0,0,.26);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
    transform:rotate(var(--r)) translate(var(--x),var(--y)) scale(var(--s));
    transition:transform .13s ease,box-shadow .2s ease,background .2s ease;
    color:#fff;cursor:pointer;padding:0;font:inherit;overflow:hidden;
  }
  .tile::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 58% at 50% -10%, rgba(255,255,255,.30), transparent 60%),
      radial-gradient(120% 78% at 50% 115%, color-mix(in srgb,var(--c) 16%,transparent), transparent 70%);
    opacity:.75}
  .tile .ic{position:relative;font-size:calc(var(--tile,120px)*.31);line-height:1;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.45)) drop-shadow(0 0 16px color-mix(in srgb,var(--c) 40%,transparent))}
  .tile .ic-img{position:relative;width:calc(var(--tile,120px)*.44);height:calc(var(--tile,120px)*.44);
    object-fit:contain;border-radius:20%;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.45)) drop-shadow(0 0 14px color-mix(in srgb,var(--c) 30%,transparent))}
  .tile .lb{position:relative;margin-top:calc(var(--tile,120px)*.075);
    font-size:calc(var(--tile,120px)*.086);font-weight:600;
    letter-spacing:.04em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.65);
    max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
  .tile.active{transform:rotate(var(--r)) translate(var(--x),var(--y)) scale(calc(var(--s)*.9));
    box-shadow:0 0 0 2px rgba(255,255,255,.6),
      0 0 60px color-mix(in srgb,var(--c) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.6)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,24px);
    background:#111114;border:1px solid #2a2a32;color:#e8e8ee;padding:11px 22px;border-radius:999px;
    font-size:14px;opacity:0;transition:all .25s ease;pointer-events:none;z-index:9;
    max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.ok{border-color:#2d5f2a;box-shadow:0 0 24px rgba(57,255,20,.12)}
  .toast.err{border-color:#6b2b2b;color:#ffb4b4}
  .offline{position:fixed;top:0;left:0;right:0;height:3px;background:#ff5252;
    box-shadow:0 0 12px #ff5252;opacity:0;transition:opacity .3s;z-index:10}
  .offline.show{opacity:1}
  .pair-panel{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.94);text-align:center}
  .pair-panel[hidden]{display:none}
  .pair-panel h1{font-size:clamp(24px,5vw,40px);margin:0 0 12px}
  .pair-panel p{max-width:440px;color:#c7c7ce;line-height:1.5}
  .pair-panel form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .pair-panel input,.pair-panel button{min-height:48px;border-radius:10px;font:inherit}
  .pair-panel input{width:190px;padding:8px 14px;border:1px solid #555;color:#fff;background:#151519;
    text-align:center;letter-spacing:.18em;user-select:text;-webkit-user-select:text}
  .pair-panel button{padding:8px 18px;border:0;background:#39ff14;color:#071006;font-weight:700}
  #pairMessage{min-height:1.5em;color:#ffb4b4}
  .now{position:absolute;left:50%;top:7px;transform:translateX(-50%);z-index:4;display:none;
    align-items:center;gap:10px;width:min(430px,calc(100vw - 210px));height:44px;padding:5px 12px;
    color:#fff;text-align:left;font:inherit;cursor:pointer;overflow:hidden;border:1px solid rgba(255,255,255,.3);
    border-radius:15px;background:rgba(20,35,39,.72);backdrop-filter:blur(20px) saturate(170%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.24)}
  .now.show{display:flex}
  .now-art{width:32px;height:32px;flex:none;object-fit:cover;border-radius:8px;background:#24242b}
  .now-meta{display:flex;flex-direction:column;min-width:0;flex:1}
  .now-title,.now-artist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .now-title{font-size:14px;font-weight:650}
  .now-artist{font-size:11px;color:rgba(255,255,255,.68)}
  .player{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    padding:24px;color:#fff;background:radial-gradient(110% 100% at 50% 0%,#343728,#11120f 65%,#080909)}
  .player.open{display:flex}
  .player-inner{display:flex;align-items:center;gap:clamp(24px,5vw,56px);width:min(980px,100%)}
  .player-art{width:min(48vw,52vh);aspect-ratio:1;flex:none;object-fit:cover;border-radius:22px;
    background:#202027;box-shadow:0 24px 70px rgba(0,0,0,.5)}
  .player-meta{min-width:0;flex:1}
  .player-kicker{font-size:11px;font-weight:700;letter-spacing:.28em;color:#ff725f}
  .player-title{margin-top:12px;font-size:clamp(28px,5vh,48px);font-weight:700;line-height:1.1}
  .player-artist{margin-top:9px;color:rgba(255,255,255,.68)}
  .player-album{margin-top:4px;color:rgba(255,255,255,.48);font-size:13px}
  .player-progress{height:4px;margin-top:26px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  .player-progress i{display:block;width:0;height:100%;background:#ff725f}
  .player-times{display:flex;justify-content:space-between;margin-top:7px;color:rgba(255,255,255,.55);font-size:11px}
  .player-controls{display:flex;align-items:center;gap:16px;margin-top:23px}
  .player-controls button,.player-close{width:48px;height:48px;border:1px solid rgba(255,255,255,.25);
    border-radius:50%;color:#fff;background:rgba(255,255,255,.1);font:inherit;font-size:19px;cursor:pointer}
  .player-controls .primary{width:60px;height:60px;border-color:#ff725f;font-size:22px}
  .player-close{position:absolute;right:22px;bottom:22px;font-size:23px}
  body.player-open .deck,body.player-open header{visibility:hidden}
  @media(max-width:650px){.now{width:calc(100vw - 160px)}.player-inner{flex-direction:column;gap:20px;text-align:center}
    .player-art{width:min(45vh,72vw)}.player-meta{width:100%}.player-controls{justify-content:center}}
</style>
</head>
<body>
<div class="offline" id="offline"></div>
<header id="hdr">
  <div class="clock" id="clock"><span id="clockTime">--:--</span><span class="ap" id="clockAp"></span></div>
  <button class="now" id="now" type="button" aria-label="Open now playing">
    <img class="now-art" id="nowArt" alt="">
    <span class="now-meta"><span class="now-title" id="nowTitle"></span><span class="now-artist" id="nowArtist"></span></span>
  </button>
</header>
<main class="deck" id="deck"></main>
<section class="player" id="player" aria-hidden="true">
  <div class="player-inner">
    <img class="player-art" id="playerArt" alt="">
    <div class="player-meta">
      <div class="player-kicker">NOW PLAYING</div>
      <div class="player-title" id="playerTitle"></div>
      <div class="player-artist" id="playerArtist"></div>
      <div class="player-album" id="playerAlbum"></div>
      <div class="player-progress"><i id="playerBar"></i></div>
      <div class="player-times"><span id="playerPosition">0:00</span><span id="playerDuration">0:00</span></div>
      <div class="player-controls">
        <button id="playerPrev" type="button" aria-label="Previous track">|◀</button>
        <button id="playerToggle" class="primary" type="button" aria-label="Play or pause">▶</button>
        <button id="playerNext" type="button" aria-label="Next track">▶|</button>
      </div>
    </div>
  </div>
  <button class="player-close" id="playerClose" type="button" aria-label="Close player">×</button>
</section>
<section class="pair-panel" id="pairPanel" hidden>
  <h1>Pair this browser</h1>
  <p>Enter the 8-digit pairing code shown in Stro-Deck on the computer. This browser will remember the pairing for 7 days.</p>
  <form id="pairForm">
    <input id="pairCode" type="password" inputmode="numeric" autocomplete="one-time-code"
      maxlength="8" pattern="[0-9]{8}" placeholder="8-digit code" aria-label="8-digit pairing code" required>
    <button type="submit">Pair device</button>
  </form>
  <p id="pairMessage" role="status"></p>
</section>
<div class="toast" id="toast"></div>
<script>
(function () {
  var deck = document.getElementById('deck');
  var headerEl = document.getElementById('hdr');
  var clockTimeEl = document.getElementById('clockTime');
  var clockApEl = document.getElementById('clockAp');
  var clockFormat = '24';
  var toastEl = document.getElementById('toast');
  var offlineEl = document.getElementById('offline');
  var pairPanel = document.getElementById('pairPanel');
  var pairForm = document.getElementById('pairForm');
  var pairCode = document.getElementById('pairCode');
  var pairMessage = document.getElementById('pairMessage');
  var state = null;
  var toastTimer = null;
  var nowData = null;
  var lastCover = -1;
  var playerOpen = false;
  var nowEl = document.getElementById('now');
  var playerEl = document.getElementById('player');

  var playerNodes = {
    nowArt: document.getElementById('nowArt'),
    nowTitle: document.getElementById('nowTitle'),
    nowArtist: document.getElementById('nowArtist'),
    art: document.getElementById('playerArt'),
    title: document.getElementById('playerTitle'),
    artist: document.getElementById('playerArtist'),
    album: document.getElementById('playerAlbum'),
    bar: document.getElementById('playerBar'),
    position: document.getElementById('playerPosition'),
    duration: document.getElementById('playerDuration'),
    toggle: document.getElementById('playerToggle')
  };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes(), ap = '';
    if (clockFormat === '12') {
      ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      clockTimeEl.textContent = h + ':' + pad(m);
    } else {
      clockTimeEl.textContent = pad(h) + ':' + pad(m);
    }
    clockApEl.textContent = ap;
  }
  tick();
  setInterval(tick, 5000);

  function toast(msg, ok) {
    toastEl.textContent = msg || '';
    toastEl.className = 'toast show ' + (ok ? 'ok' : 'err');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.className = 'toast ' + (ok ? 'ok' : 'err'); }, 1900);
  }

  function showPairing(message) {
    closePlayer();
    pairPanel.hidden = false;
    deck.style.visibility = 'hidden';
    pairMessage.textContent = message || '';
  }

  function loadAuthorized() {
    pairPanel.hidden = true;
    deck.style.visibility = '';
    load();
    loadNow();
  }

  pairForm.addEventListener('submit', function (e) {
    e.preventDefault();
    pairMessage.textContent = '';
    fetch('/api/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ code: pairCode.value })
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok || !j.ok) throw new Error(j.msg || 'Pairing failed');
        pairCode.value = '';
        loadAuthorized();
      });
    }).catch(function (err) {
      showPairing(err.message || 'Pairing failed');
    });
  });

  /* deterministic "scatter" so the layout is stable but not a rigid grid */
  function scatter(i) {
    var x = (((i * 53) % 7) - 3) * 0.4;
    var y = (((i * 29) % 9) - 4) * 0.3;
    return { r: 0, x: x, y: y, s: 1 };
  }

  function layout() {
    if (!state) return;
    var cs = getComputedStyle(deck);
    var padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    var padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    var gap = 8;
    var w = (deck.clientWidth - padX - gap * (state.cols - 1)) / state.cols;
    var h = (deck.clientHeight - padY - gap * (state.rows - 1)) / state.rows;
    var size = Math.max(46, Math.min(w, h) * 0.88);
    deck.style.gap = gap + 'px';
    deck.style.setProperty('--tile', size + 'px');
  }

  function applyBackground(s) {
    var bg = s.bg || '';
    if (bg.indexOf('img:') === 0) {
      document.body.classList.add('has-bg');
      document.body.style.backgroundImage = "url('/bg/" + encodeURIComponent(bg.substring(4)) + "')";
      document.body.style.backgroundPosition = s.bgpos || 'center';
    } else {
      document.body.classList.remove('has-bg');
      document.body.style.backgroundImage = '';
    }
  }

  function render(s) {
    state = s;
    applyBackground(s);
    headerEl.className = 'c-' + (s.clock || 'bold');
    clockFormat = s.clockfmt || '24';
    tick();
    deck.style.gridTemplateColumns = 'repeat(' + s.cols + ',1fr)';
    deck.style.gridTemplateRows = 'repeat(' + s.rows + ',1fr)';
    deck.innerHTML = '';
    var frag = document.createDocumentFragment();
    for (var i = 0; i < s.buttons.length; i++) {
      (function (b, idx) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        var t = document.createElement('button');
        t.className = 'tile';
        t.style.setProperty('--c', b.color || '#39ff14');
        var sc = scatter(idx);
        t.style.setProperty('--r', sc.r + 'deg');
        t.style.setProperty('--x', sc.x + 'px');
        t.style.setProperty('--y', sc.y + 'px');
        t.style.setProperty('--s', sc.s);
        var icon = b.icon || '\u2022';
        var lb = document.createElement('span');
        lb.className = 'lb';
        lb.textContent = b.label || '';
        if (icon.indexOf('img:') === 0) {
          var img = document.createElement('img');
          img.className = 'ic-img';
          img.alt = '';
          img.src = '/icons/' + encodeURIComponent(icon.substring(4));
          t.appendChild(img);
        } else {
          var ic = document.createElement('span');
          ic.className = 'ic';
          ic.textContent = icon;
          t.appendChild(ic);
        }
        t.appendChild(lb);
        t.addEventListener('click', function () { press(b, t); });
        cell.appendChild(t);
        frag.appendChild(cell);
      })(s.buttons[i], i);
    }
    deck.appendChild(frag);
    layout();
  }

  var busy = false;
  function press(b, el) {
    el.classList.add('active');
    setTimeout(function () { el.classList.remove('active'); }, 170);
    if (navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    if (busy) return;
    busy = true;
    fetch('/api/press', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: b.id })
    }).then(function (r) {
      return r.json().then(function (j) { return { response: r, body: j }; });
    }).then(function (result) {
        if (result.response.status === 403) {
          showPairing(result.body.msg || 'Pair this browser with the desktop app.');
          return;
        }
        var j = result.body;
        toast(j.msg || (j.ok ? 'OK' : 'Error'), !!j.ok);
        offlineEl.className = 'offline';
      })
      .catch(function () {
        toast('\u0644\u0627 \u064a\u0648\u062c\u062f \u0627\u062a\u0635\u0627\u0644 \u0628\u0627\u0644\u0643\u0645\u0628\u064a\u0648\u062a\u0631', false);
        offlineEl.className = 'offline show';
      })
      .then(function () { setTimeout(function () { busy = false; }, 220); });
  }

  function formatTime(seconds) {
    seconds = Math.max(0, Math.floor(Number(seconds) || 0));
    return Math.floor(seconds / 60) + ':' + pad(seconds % 60);
  }

  function closePlayer() {
    playerOpen = false;
    playerEl.classList.remove('open');
    playerEl.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('player-open');
  }

  function updateProgress() {
    if (!nowData) return;
    var duration = Number(nowData.end) || 0;
    var position = Number(nowData.pos) || 0;
    playerNodes.bar.style.width = duration > 0 ? Math.max(0, Math.min(100, position / duration * 100)) + '%' : '0%';
    playerNodes.position.textContent = formatTime(position);
    playerNodes.duration.textContent = formatTime(duration);
  }

  function applyNow(data) {
    nowData = data;
    if (!data || data.on !== 1 || !data.title) {
      nowEl.classList.remove('show');
      if (playerOpen) closePlayer();
      return;
    }

    nowEl.classList.add('show');
    playerNodes.nowTitle.textContent = data.title;
    playerNodes.nowArtist.textContent = data.artist || '';
    playerNodes.title.textContent = data.title;
    playerNodes.artist.textContent = data.artist || '';
    playerNodes.album.textContent = data.album || '';
    playerNodes.toggle.textContent = data.playing === 1 ? 'Ⅱ' : '▶';
    if (data.cover !== lastCover) {
      lastCover = data.cover;
      var coverUrl = '/api/cover?v=' + encodeURIComponent(data.cover);
      [playerNodes.nowArt, playerNodes.art].forEach(function (image) {
        image.style.visibility = 'visible';
        image.onerror = function () { image.style.visibility = 'hidden'; };
        image.src = coverUrl;
      });
    }
    updateProgress();
  }

  function loadNow() {
    fetch('/api/now', { cache: 'no-store' }).then(function (response) {
      return response.json();
    }).then(applyNow).catch(function () {});
  }

  function sendMedia(command) {
    fetch('/api/media', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cmd: command })
    }).then(function (response) {
      return response.json().then(function (data) {
        if (response.status === 403) {
          showPairing(data.msg || 'Pair this browser with the desktop app.');
          return;
        }
        setTimeout(loadNow, 300);
      });
    }).catch(function () {});
  }

  nowEl.addEventListener('click', function () {
    if (!nowData || nowData.on !== 1) return;
    playerOpen = true;
    playerEl.classList.add('open');
    playerEl.setAttribute('aria-hidden', 'false');
    document.body.classList.add('player-open');
    updateProgress();
  });
  document.getElementById('playerClose').addEventListener('click', closePlayer);
  document.getElementById('playerToggle').addEventListener('click', function () { sendMedia('toggle'); });
  document.getElementById('playerPrev').addEventListener('click', function () { sendMedia('prev'); });
  document.getElementById('playerNext').addEventListener('click', function () { sendMedia('next'); });
  setInterval(function () {
    if (playerOpen && nowData && nowData.playing === 1 && nowData.end > nowData.pos) {
      nowData.pos += 1;
      updateProgress();
    }
  }, 1000);
  loadNow();
  setInterval(loadNow, 2000);

  var lastJson = '';
  function load() {
    fetch('/api/state', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        offlineEl.className = 'offline';
        if (s.v) {
          if (window.__deckV && window.__deckV !== s.v) { location.reload(); return; }
          window.__deckV = s.v;
        }
        var j = JSON.stringify(s);
        if (j !== lastJson) { lastJson = j; render(s); }
      })
      .catch(function () { offlineEl.className = 'offline show'; });
  }

  // Prevent screen sleep / screensaver via silent audio loop + wake lock
  function keepAlive() {
    if ('wakeLock' in navigator) {
      try { navigator.wakeLock.request('screen').catch(function(){}); } catch(e){}
    }
  }
  keepAlive();
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') { keepAlive(); }
  });

  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', function () { setTimeout(layout, 150); });
  document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function () {
    var el = document.documentElement;
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (el.requestFullscreen) { el.requestFullscreen(); }
  });
  load();
  setInterval(load, 5000);
})();
</script>
</body>
</html>
